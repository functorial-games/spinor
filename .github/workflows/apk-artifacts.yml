name: Spinor APK artifacts

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native/**"
      - ".github/workflows/apk-artifacts.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: miro-a1
            abi: armeabi-v7a
          - device: miro-c67
            abi: arm64-v8a

    steps:
      - name: Checkout Spinor
        uses: actions/checkout@v4

      - name: Checkout canonical Android NDK substrate
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/android-NDK
          path: deps/android-NDK

      - name: Checkout public development signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          path: deps/wegert

      - name: Install Android inputs
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "ndk;27.2.12479018" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Verify public development signer
        run: |
          bash deps/wegert/_/build/android-signing/verify-test-signing.sh

      - name: Build signed APK
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_API: "21"
          ANDROID_NDK_CHECKOUT: ${{ github.workspace }}/deps/android-NDK
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          SPINOR_KEYSTORE: ${{ github.workspace }}/deps/wegert/_/build/app/wegert-debug.keystore
          SPINOR_KEYSTORE_TYPE: PKCS12
          SPINOR_KEY_ALIAS: wegert-debug
          SPINOR_STORE_PASSWORD: wegert-debug
          SPINOR_KEY_PASSWORD: wegert-debug
          SPINOR_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
          SPINOR_TARGET_SDK: "34"
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$sdk_root/ndk/27.2.12479018"
          export ANDROID_BUILD_TOOLS="$sdk_root/build-tools/35.0.0"
          output="build/artifacts/spinor-${{ matrix.device }}-${ANDROID_ABI}.apk"
          native="build/artifacts/${ANDROID_ABI}/libspinor.so"
          mkdir -p "$(dirname "$native")" "$(dirname "$output")"
          bash android/build-native.sh "$native"
          bash android/build-apk.sh "$native" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: spinor-${{ matrix.device }}-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            build/artifacts/spinor-${{ matrix.device }}-${{ matrix.abi }}.apk
            build/artifacts/spinor-${{ matrix.device }}-${{ matrix.abi }}.apk.sha256
            build/artifacts/spinor-${{ matrix.device }}-${{ matrix.abi }}.receipt.tsv
