name: Spinor native C producer
description: Qualify the pinned compiler and shared C-stage contract
outputs:
  compiler:
    description: Qualified native ICK driver
    value: ${{ steps.ick.outputs.compiler }}
runs:
  using: composite
  steps:
    - id: ick
      uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: isomorphisms/ai-ci
        ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        path: .aici-host
        sparse-checkout: |
          src/aici.c
          contracts/build-toolchain-v0.contract.tsv
        persist-credentials: false
    - name: Verify the declared C stages
      shell: bash
      run: make -f ci/Makefile verify ICK="${{ steps.ick.outputs.compiler }}"
